services:
  keycloak:
    environment:
      KC_HOSTNAME: ${CODESPACE_KEYCLOAK_URL}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./.codespaces/collector-realm.json:/opt/keycloak/data/import/collector-realm.json:ro

  listing-service:
    environment:
      KEYCLOAK_ISSUER: ${CODESPACE_KEYCLOAK_ISSUER}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/collector/protocol/openid-connect/certs

  api-gateway:
    environment:
      CORS_ORIGIN: ${CODESPACE_WEB_URL}

  web:
    build:
      args:
        VITE_API_URL: ${CODESPACE_API_URL}/api
        VITE_KEYCLOAK_URL: ${CODESPACE_KEYCLOAK_URL}
