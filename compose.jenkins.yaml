services:
  jenkins:
    build:
      context: .
      dockerfile: infra/jenkins/Dockerfile
    container_name: collector-jenkins
    user: root
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-CollectorDemo2026!}
    ports:
      - "127.0.0.1:8083:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - collector_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  collector_jenkins_home:
