services:
  postgres:
    image: postgres:16-alpine
    container_name: collector-postgres
    environment:
      POSTGRES_DB: collector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - collector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d collector"]
      interval: 5s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: collector-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Admin123!
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./infra/keycloak/collector-realm.json:/opt/keycloak/data/import/collector-realm.json:ro

volumes:
  collector_pgdata:
