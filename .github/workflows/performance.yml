name: Collector Performance

on:
  pull_request:
    paths:
      - "scripts/test-performance.mjs"
      - ".github/workflows/performance.yml"
      - "package.json"
      - "compose.yaml"
      - "services/**"
      - "apps/web/**"
  workflow_dispatch:
    inputs:
      warmup:
        description: "Nombre de requêtes de warm-up"
        required: false
        default: "30"
        type: string
      requests:
        description: "Nombre de requêtes mesurées"
        required: false
        default: "300"
        type: string
      concurrency:
        description: "Concurrence"
        required: false
        default: "20"
        type: string
      p95_ms:
        description: "Seuil p95 pédagogique en millisecondes"
        required: false
        default: "1500"
        type: string

permissions:
  contents: read

jobs:
  performance-smoke:
    name: API Gateway performance smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Start microservices stack
        run: docker compose up -d --build

      - name: Wait for stack
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Run performance smoke
        env:
          PERF_WARMUP_REQUESTS: ${{ inputs.warmup || '30' }}
          PERF_REQUESTS: ${{ inputs.requests || '300' }}
          PERF_CONCURRENCY: ${{ inputs.concurrency || '20' }}
          PERF_P95_MS: ${{ inputs.p95_ms || '1500' }}
        run: npm run test:perf

      - name: Cleanup
        if: always()
        run: docker compose down -v
