name: Collector CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project deliverables
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/01-product-owner/cadrage-collector-shop.md
          test -f docs/02-lead-dev/qualite-logicielle.md
          test -f docs/03-architecture/architecture-macroscopique.md
          test -f docs/04-devops/pipeline-cible.md
          test -f docs/05-prototype/README.md
          test -f apps/api/src/server.js
          test -f apps/web/src/main.js
          jq empty infra/keycloak/collector-realm.json
          docker compose config -q
          echo "Repository structure OK"

  prototype-ci:
    name: Prototype tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build workspaces
        run: npm run build

  integration-smoke:
    name: Local stack smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Start PostgreSQL and Keycloak
        run: docker compose up -d postgres keycloak

      - name: Wait for Keycloak
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:8081/realms/collector/.well-known/openid-configuration >/dev/null; then
              echo "Keycloak ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs keycloak
          exit 1

      - name: Start API
        shell: bash
        run: |
          npm run dev:api >/tmp/collector-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/collector-api.log
          exit 1

      - name: Start frontend
        shell: bash
        run: |
          npm run dev:web >/tmp/collector-web.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:5173 >/tmp/frontend.html; then
              grep -q "Collector.shop" /tmp/frontend.html
              echo "Frontend ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/collector-web.log
          exit 1

      - name: Test public API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/api/health | jq -e '.status == "ok"'
          curl -fsS http://localhost:3000/api/catalog | jq -e 'length >= 3'

      - name: Test USER authorization
        shell: bash
        run: |
          set -euo pipefail
          USER_TOKEN=$(curl -fsS -X POST             http://localhost:8081/realms/collector/protocol/openid-connect/token             -H "Content-Type: application/x-www-form-urlencoded"             -d "client_id=collector-web"             -d "grant_type=password"             -d "username=user1"             -d "password=User123!" | jq -r '.access_token')

          test -n "$USER_TOKEN"
          curl -fsS -H "Authorization: Bearer $USER_TOKEN"             http://localhost:3000/api/me | jq -e '.roles | index("USER") != null'

          STATUS=$(curl -sS -o /tmp/user-admin.json -w "%{http_code}"             -H "Authorization: Bearer $USER_TOKEN"             http://localhost:3000/api/admin/stats)
          test "$STATUS" = "403"

      - name: Test ADMIN authorization
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_TOKEN=$(curl -fsS -X POST             http://localhost:8081/realms/collector/protocol/openid-connect/token             -H "Content-Type: application/x-www-form-urlencoded"             -d "client_id=collector-web"             -d "grant_type=password"             -d "username=admin1"             -d "password=Admin123!" | jq -r '.access_token')

          test -n "$ADMIN_TOKEN"
          curl -fsS -H "Authorization: Bearer $ADMIN_TOKEN"             http://localhost:3000/api/admin/stats | jq -e '.message == "Admin access granted"'

      - name: Cleanup
        if: always()
        run: docker compose down -v
