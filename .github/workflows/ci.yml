name: Collector CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Microservices structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate microservices deliverables
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f services/api-gateway/src/server.js
          test -f services/catalog-service/src/server.js
          test -f services/listing-service/src/server.js
          test -f services/notification-service/src/server.js
          test -f docs/03-architecture/architecture-technique-microservices.md
          test -f docs/05-prototype/MIGRATION-MICROSERVICES.md
          test -f docs/05-prototype/TESTS-EQUIPE.md
          test -f scripts/test-microservices.sh
          test ! -e docs/05-prototype/TESTS-MICROSERVICES.md
          jq empty infra/keycloak/collector-realm.json
          docker compose config -q
          echo "Microservices repository structure OK"

  microservices-ci:
    name: Unit tests and builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build workspaces
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  distributed-smoke:
    name: Distributed microservices smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start full microservices stack
        run: docker compose up -d --build

      - name: Run shared team microservices recipe
        shell: bash
        run: bash scripts/test-microservices.sh

      - name: Cleanup
        if: always()
        run: docker compose down -v
