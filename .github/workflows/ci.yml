name: Collector CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project deliverables
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/01-product-owner/cadrage-collector-shop.md
          test -f docs/02-lead-dev/qualite-logicielle.md
          test -f docs/03-architecture/architecture-macroscopique.md
          test -f docs/04-devops/pipeline-cible.md
          test -f docs/05-prototype/README.md
          test -f apps/api/src/server.js
          test -f apps/web/src/main.js
          echo "Repository structure OK"

  prototype-ci:
    name: Prototype tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build workspaces
        run: npm run build
